name: 💡 Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make WoW Classic DB even better? We'd love to hear it!

  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: What feature would you like to see added?
      placeholder: "Add a favorites system to save frequently viewed items"
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: How would this feature be helpful? What problem does it solve?
      placeholder: "As a raider, I often look up the same BiS items repeatedly. A favorites list would save time..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: How do you envision this feature working?
      placeholder: "Add a heart icon next to item names that saves them to a Favorites tab..."

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Are there other ways this could be implemented?
      placeholder: "Could also use a bookmark system or recent items list..."

  - type: checkboxes
    id: feature_type
    attributes:
      label: Feature Type
      description: What kind of feature is this?
      options:
        - label: User Interface improvement
        - label: Search enhancement
        - label: Data display improvement
        - label: New functionality
        - label: Performance improvement
        - label: Accessibility improvement
