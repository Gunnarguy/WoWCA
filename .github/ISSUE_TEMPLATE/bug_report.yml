name: 🐛 Bug Report
description: Report a bug or crash in WoW Classic DB
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us investigate.

  - type: input
    id: device
    attributes:
      label: Device & iOS Version
      description: What device and iOS version are you using?
      placeholder: "iPhone 15 Pro, iOS 17.5"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App Version
      description: What version of WoW Classic DB are you using? (Found in About tab)
      placeholder: "1.0 (1)"
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
      placeholder: "When I search for 'Thunderfury', the app crashes..."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Open the app
        2. Tap on search
        3. Type "Thunderfury"
        4. App crashes
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or information about the problem here.
      placeholder: "This only happens when..."

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this hasn't been reported before
          required: true
        - label: I can reproduce this bug consistently
          required: false
